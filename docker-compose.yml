name: ${COMPOSE_PROJECT_NAME:-closetsearch}

x-postgres-environment: &postgres-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-closetsearch}:${POSTGRES_PASSWORD:-local-compose-password-change-me}@postgres:5432/${POSTGRES_DB:-closetsearch}
  POSTGRES_SSL_MODE: disable
  POSTGRES_ALLOW_INSECURE: "true"
  POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
  POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-5000}
  POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
  POSTGRES_STATEMENT_TIMEOUT_MS: ${POSTGRES_STATEMENT_TIMEOUT_MS:-10000}
  POSTGRES_QUERY_TIMEOUT_MS: ${POSTGRES_QUERY_TIMEOUT_MS:-12000}
  POSTGRES_TRANSACTION_RETRY_LIMIT: ${POSTGRES_TRANSACTION_RETRY_LIMIT:-3}

x-provider-environment: &provider-environment
  PROVIDER_RUNTIME_MODE: ${PROVIDER_RUNTIME_MODE:-real}
  PROVIDER_ALLOW_MOCK_FALLBACK: ${PROVIDER_ALLOW_MOCK_FALLBACK:-false}
  PROVIDER_MOCK_ENABLED: ${PROVIDER_MOCK_ENABLED:-false}
  PROVIDER_REQUEST_TIMEOUT_MS: ${PROVIDER_REQUEST_TIMEOUT_MS:-10000}
  PROVIDER_MAX_ACTIVE_PROVIDERS: ${PROVIDER_MAX_ACTIVE_PROVIDERS:-2}
  EBAY_PROVIDER_ENABLED: ${EBAY_PROVIDER_ENABLED:-false}
  EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
  EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
  EBAY_API_BASE_URL: ${EBAY_API_BASE_URL:-https://api.ebay.com}
  EBAY_IDENTITY_BASE_URL: ${EBAY_IDENTITY_BASE_URL:-https://api.ebay.com}
  EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_US}
  EBAY_AFFILIATE_CAMPAIGN_ID: ${EBAY_AFFILIATE_CAMPAIGN_ID:-}
  EBAY_AFFILIATE_REFERENCE_ID: ${EBAY_AFFILIATE_REFERENCE_ID:-}
  EBAY_REQUEST_TIMEOUT_MS: ${EBAY_REQUEST_TIMEOUT_MS:-8000}
  EBAY_MIN_REQUEST_INTERVAL_MS: ${EBAY_MIN_REQUEST_INTERVAL_MS:-250}
  EBAY_MAX_CONCURRENCY: ${EBAY_MAX_CONCURRENCY:-2}
  EBAY_MAX_RETRIES: ${EBAY_MAX_RETRIES:-3}
  GRAILED_PROVIDER_ENABLED: ${GRAILED_PROVIDER_ENABLED:-false}
  GRAILED_SCRAPING_ALLOWED: ${GRAILED_SCRAPING_ALLOWED:-false}
  GRAILED_AUTHORIZATION_REFERENCE: ${GRAILED_AUTHORIZATION_REFERENCE:-}
  GRAILED_BASE_URL: ${GRAILED_BASE_URL:-https://www.grailed.com}
  GRAILED_REQUEST_TIMEOUT_MS: ${GRAILED_REQUEST_TIMEOUT_MS:-5000}
  GRAILED_MIN_REQUEST_INTERVAL_MS: ${GRAILED_MIN_REQUEST_INTERVAL_MS:-3000}
  GRAILED_MAX_RESULTS_PER_SEARCH: ${GRAILED_MAX_RESULTS_PER_SEARCH:-24}
  GRAILED_USER_AGENT: ${GRAILED_USER_AGENT:-ClosetSearchBot/0.1 contact:<project-contact-email>}

x-api-environment: &api-environment
  <<: *provider-environment
  NODE_ENV: ${NODE_ENV:-development}
  HOST: 0.0.0.0
  PORT: "4000"
  SHUTDOWN_TIMEOUT_MS: "10000"
  PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
  CLOSETSEARCH_DB_PATH: /var/lib/closetsearch/legacy.sqlite
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8080}
  AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-closetsearch_session}
  AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-14}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER:-local-compose-session-pepper-change-before-production}
  ENGAGEMENT_SESSION_PEPPER: ${ENGAGEMENT_SESSION_PEPPER:-local-compose-engagement-pepper-change-before-production}

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closetsearch}
      POSTGRES_USER: ${POSTGRES_USER:-closetsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-password-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *postgres-environment
      POSTGRES_APPLICATION_NAME: closetsearch-migrate
    command: ["node", "dist/db/postgres/migrate-cli.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *api-environment]
      POSTGRES_APPLICATION_NAME: closetsearch-api
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - api_legacy_data:/var/lib/closetsearch
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *provider-environment]
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_APPLICATION_NAME: closetsearch-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_PROVIDER_INGESTION_ENABLED: ${WORKER_PROVIDER_INGESTION_ENABLED:-true}
      WORKER_DEFAULT_INGESTION_QUERY: ${WORKER_DEFAULT_INGESTION_QUERY:-designer clothing}
      WORKER_ACTIVE_INGESTION_INTERVAL_SECONDS: ${WORKER_ACTIVE_INGESTION_INTERVAL_SECONDS:-900}
      WORKER_SOLD_INGESTION_INTERVAL_SECONDS: ${WORKER_SOLD_INGESTION_INTERVAL_SECONDS:-3600}
      WORKER_INGESTION_PAGE_SIZE: ${WORKER_INGESTION_PAGE_SIZE:-50}
      WORKER_INGESTION_SEARCHES_JSON: ${WORKER_INGESTION_SEARCHES_JSON:-}
      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-60000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  backup:
    image: postgres:17.5-alpine
    profiles: ["operations"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-closetsearch}:${POSTGRES_PASSWORD:-local-compose-password-change-me}@postgres:5432/${POSTGRES_DB:-closetsearch}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-false}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    entrypoint: ["/bin/sh", "/opt/closetsearch/postgres-backup.sh"]
    volumes:
      - ./scripts/postgres-backup.sh:/opt/closetsearch/postgres-backup.sh:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  api_legacy_data:
  postgres_backups:
  postgres_data:
