  SHUTDOWN_TIMEOUT_MS: "10000"
  PERSISTENCE_DRIVER: ${PERSISTENCE_DRIVER:-postgres}
  CLOSETSEARCH_DB_PATH: /var/lib/closetsearch/legacy.sqlite
  AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8080}
  AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-closetsearch_session}
  AUTH_SESSION_TTL_DAYS: ${AUTH_SESSION_TTL_DAYS:-14}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_SESSION_PEPPER: ${AUTH_SESSION_PEPPER:-local-compose-session-pepper-change-before-production}
  ENGAGEMENT_SESSION_PEPPER: ${ENGAGEMENT_SESSION_PEPPER:-local-compose-engagement-pepper-change-before-production}
  OPERATIONS_BEARER_TOKEN: ${OPERATIONS_BEARER_TOKEN:-local-compose-operations-token-change-before-production}
  CLOSETSEARCH_RECOMMENDATION_MODE: ${CLOSETSEARCH_RECOMMENDATION_MODE:-disabled}
  CLOSETSEARCH_RECOMMENDATION_ARTIFACT_PATH: ${CLOSETSEARCH_RECOMMENDATION_ARTIFACT_PATH:-}
  CLOSETSEARCH_RECOMMENDATION_PROMOTION_APPROVED: ${CLOSETSEARCH_RECOMMENDATION_PROMOTION_APPROVED:-false}
  CLOSETSEARCH_RECOMMENDATION_TIMEOUT_MS: ${CLOSETSEARCH_RECOMMENDATION_TIMEOUT_MS:-25}
  CLOSETSEARCH_RECOMMENDATION_MAX_ARTIFACT_AGE_DAYS: ${CLOSETSEARCH_RECOMMENDATION_MAX_ARTIFACT_AGE_DAYS:-45}

x-notification-environment: &notification-environment
  ALERT_DELIVERY_ENABLED: ${ALERT_DELIVERY_ENABLED:-false}
  ALERT_DELIVERY_CLAIM_TIMEOUT_MS: ${ALERT_DELIVERY_CLAIM_TIMEOUT_MS:-300000}
  ALERT_PUBLIC_BASE_URL: ${ALERT_PUBLIC_BASE_URL:-http://localhost:8080}
  ACCOUNT_ACTION_BASE_URL: ${ACCOUNT_ACTION_BASE_URL:-http://localhost:8080}
  NOTIFICATION_DESTINATION_PEPPER: ${NOTIFICATION_DESTINATION_PEPPER:-local-compose-notification-destination-pepper-change-before-production}
  EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-disabled}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
  EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMS_TRANSPORT: ${SMS_TRANSPORT:-disabled}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
  TWILIO_WEBHOOK_SECRET: ${TWILIO_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closetsearch}
      POSTGRES_USER: ${POSTGRES_USER:-closetsearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-compose-password-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    image: ${CLOSETSEARCH_API_IMAGE:-closetsearch-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      <<: *postgres-environment
      POSTGRES_APPLICATION_NAME: closetsearch-migrate
    command: ["node", "dist/db/postgres/migrate-cli.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    image: ${CLOSETSEARCH_API_IMAGE:-closetsearch-api:local}
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *api-environment, *notification-environment]
      POSTGRES_APPLICATION_NAME: closetsearch-api
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - api_legacy_data:/var/lib/closetsearch
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  worker:
    image: ${CLOSETSEARCH_WORKER_IMAGE:-closetsearch-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *api-environment, *notification-environment]
      POSTGRES_APPLICATION_NAME: closetsearch-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_PROVIDER_INGESTION_ENABLED: ${WORKER_PROVIDER_INGESTION_ENABLED:-true}
      WORKER_DEFAULT_INGESTION_QUERY: ${WORKER_DEFAULT_INGESTION_QUERY:-designer clothing}
      WORKER_ACTIVE_INGESTION_INTERVAL_SECONDS: ${WORKER_ACTIVE_INGESTION_INTERVAL_SECONDS:-900}
      WORKER_SOLD_INGESTION_INTERVAL_SECONDS: ${WORKER_SOLD_INGESTION_INTERVAL_SECONDS:-3600}
      WORKER_INGESTION_PAGE_SIZE: ${WORKER_INGESTION_PAGE_SIZE:-50}
      WORKER_INGESTION_SEARCHES_JSON: ${WORKER_INGESTION_SEARCHES_JSON:-}
      WORKER_LEASE_DURATION_MS: ${WORKER_LEASE_DURATION_MS:-60000}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  web:
    image: ${CLOSETSEARCH_WEB_IMAGE:-closetsearch-web:local}
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  backup:
    image: postgres:17.5-alpine
    profiles: ["operations"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-closetsearch}:${POSTGRES_PASSWORD:-local-compose-password-change-me}@postgres:5432/${POSTGRES_DB:-closetsearch}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-false}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    entrypoint: ["/bin/sh", "/opt/closetsearch/postgres-backup.sh"]
    volumes:
      - ./scripts/postgres-backup.sh:/opt/closetsearch/postgres-backup.sh:ro
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  api_legacy_data:
  postgres_backups:
  postgres_data:
